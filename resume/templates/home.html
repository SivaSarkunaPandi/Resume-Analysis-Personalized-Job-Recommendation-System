<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Times New Roman with elegant fallbacks */
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #faf7f2;
            color: #2c3e50;
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation */
        .navbar {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
        }

        .navbar-brand {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 24px;
            color: white!important;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
            color: #f39c12 !important;
        }

        .nav-link {
            font-family: 'Times New Roman', Times, serif;
            color: rgba(255,255,255,0.9) !important;
            font-weight: bold;
            
            margin: 0 1rem;
            position: relative;
            transition: all 0.3s ease;
            
            font-size: 20px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #f1c40f;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link:hover {
            color: #f1c40f !important;
            transform: translateY(-2px);
        }

        /* Hero Section with Background Image */
        .hero {
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1171&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 100px 0;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 L100,0 L100,100 Z" fill="rgba(255,255,255,0.05)"/></svg>');
            animation: gradientShift 10s ease infinite;
        }

        .hero-content {
            animation: fadeInUp 1.2s ease;
            position: relative;
            z-index: 2;
            text-align: center;
            margin: 0 auto;
            max-width: 800px;
        }

        .hero h1 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 800;
            font-size: 4.5rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.4rem;
            color: rgba(255,255,255,0.95);
            max-width: 700px;
            margin: 0 auto 2.5rem;
            font-style: italic;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .hero-image:hover {
            transform: scale(1.02);
        }

        /* Buttons */
        .btn-primary-custom {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #2c3e50;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.4s ease;
            border: none;
            box-shadow: 0 10px 20px rgba(241, 196, 15, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary-custom:hover::before {
            left: 100%;
        }

        .btn-primary-custom:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(241, 196, 15, 0.4);
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #2c3e50;
        }

        .btn-outline-custom {
            background: transparent;
            color: white;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 600;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.4s ease;
            border: 2px solid white;
            margin-left: 15px;
        }

        .btn-outline-custom:hover {
            background: white;
            color: #2c3e50;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.2);
        }

        /* Section Titles */
        .section-title {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 800;
            font-size: 3rem;
            color: #2c3e50;
            margin-bottom: 3rem;
            position: relative;
            display: inline-block;
            animation: slideInLeft 1s ease;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border-radius: 2px;
            animation: scaleIn 1s ease;
        }

        /* Feature Cards */
        .features {
            padding: 100px 0;
            background: #faf7f2;
            width: 100%;
        }

        .feature-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
            height: 100%;
            border: 1px solid rgba(0,0,0,0.05);
            animation: scaleIn 1s ease;
            animation-fill-mode: both;
        }

        .feature-card:nth-child(1) { animation-delay: 0.2s; }
        .feature-card:nth-child(2) { animation-delay: 0.4s; }
        .feature-card:nth-child(3) { animation-delay: 0.6s; }

        .feature-card:hover {
            transform: translateY(-20px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border-color: #f1c40f;
        }

        .feature-icon {
            font-size: 3rem;
            color: #f1c40f;
            margin-bottom: 1.5rem;
            animation: float 6s ease-in-out infinite;
        }

        .feature-card h3 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        .feature-card p {
            font-size: 1.1rem;
            color: #5d6d7e;
            font-style: italic;
        }

        /* How It Works */
        .how-it-works {
            padding: 100px 0;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d5 100%);
            width: 100%;
        }

        .step {
            display: flex;
            align-items: center;
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: slideInRight 1s ease;
            animation-fill-mode: both;
            transition: all 0.4s ease;
        }

        .step:hover {
            transform: translateX(10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .step:nth-child(1) { animation-delay: 0.2s; }
        .step:nth-child(2) { animation-delay: 0.4s; }
        .step:nth-child(3) { animation-delay: 0.6s; }

        .step-number {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #2c3e50;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-right: 2rem;
            flex-shrink: 0;
            animation: float 6s ease-in-out infinite;
        }

        .step-content h3 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .step-content p {
            font-size: 1.1rem;
            color: #5d6d7e;
            margin: 0;
            font-style: italic;
        }

        /* Career Paths */
        .career-paths {
            padding: 100px 0;
            background: #faf7f2;
            width: 100%;
        }

        .path-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.5s ease;
            margin-bottom: 2rem;
            animation: scaleIn 1s ease;
            animation-fill-mode: both;
        }

        .path-card:nth-child(1) { animation-delay: 0.2s; }
        .path-card:nth-child(2) { animation-delay: 0.4s; }
        .path-card:nth-child(3) { animation-delay: 0.6s; }

        .path-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .path-image {
            height: 250px;
            background-size: cover;
            background-position: center;
            transition: all 0.5s ease;
        }

        .path-card:hover .path-image {
            transform: scale(1.1);
        }

        .path-content {
            padding: 2rem;
        }

        .path-content h3 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        .path-content p {
            font-size: 1.1rem;
            color: #5d6d7e;
            font-style: italic;
        }

        .badge-custom {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #2c3e50;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 1rem;
            animation: float 6s ease-in-out infinite;
        }

        /* Testimonials */
        .testimonials {
            padding: 100px 0;
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d5 100%);
            width: 100%;
        }

        .testimonial-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
            animation: slideInLeft 1s ease;
            animation-fill-mode: both;
        }

        .testimonial-card:nth-child(1) { animation-delay: 0.2s; }
        .testimonial-card:nth-child(2) { animation-delay: 0.4s; }

        .testimonial-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .testimonial-text {
            font-size: 1.2rem;
            font-style: italic;
            color: #2c3e50;
            margin-bottom: 2rem;
            line-height: 1.8;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            font-weight: 700;
            font-size: 1.5rem;
            margin-right: 1rem;
            animation: float 6s ease-in-out infinite;
        }

        .author-info h4 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #2c3e50;
            margin: 0;
        }

        .author-info p {
            font-size: 1rem;
            color: #5d6d7e;
            margin: 0;
            font-style: italic;
        }

        /* CTA Section */
        .cta-section {
            padding: 100px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .cta-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        .cta-section h2 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 800;
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s ease;
        }

        .cta-section p {
            font-size: 1.3rem;
            max-width: 700px;
            margin: 0 auto 2.5rem;
            opacity: 0.95;
            font-style: italic;
        }

        .btn-light-custom {
            background: white;
            color: #2c3e50;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            padding: 16px 45px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-light-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(241,196,15,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-light-custom:hover::before {
            left: 100%;
        }

        .btn-light-custom:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            background: #f1c40f;
            color: #2c3e50;
        }

        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            padding: 4rem 0 2rem;
            width: 100%;
        }

        .footer-logo {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #f1c40f;
            margin-bottom: 1.5rem;
        }

        .footer-links h5 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #f1c40f;
            margin-bottom: 1.5rem;
        }

        .footer-links ul {
            list-style: none;
            padding: 0;
        }

        .footer-links li {
            margin-bottom: 0.8rem;
        }

        .footer-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .footer-links a:hover {
            color: #f1c40f;
            padding-left: 8px;
        }

        .social-icons a {
            display: inline-block;
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            text-align: center;
            line-height: 45px;
            margin-right: 10px;
            color: white;
            transition: all 0.4s ease;
        }

        .social-icons a:hover {
            background: #f1c40f;
            color: #2c3e50;
            transform: translateY(-5px) rotate(360deg);
        }

        .copyright {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            font-style: italic;
        }

        /* Container centering */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.8rem;
            }
            
            .hero p {
                font-size: 1.2rem;
            }
            
            .section-title {
                font-size: 2.2rem;
            }
            
            .step {
                flex-direction: column;
                text-align: center;
            }
            
            .step-number {
                margin-right: 0;
                margin-bottom: 1.5rem;
            }
            
            .btn-outline-custom {
                margin-left: 0;
                margin-top: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-compass me-2"></i>RESUME ANALYSIS USING ML 
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">HOME</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">ABOUT</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/career">CAREER</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/predict">PREDICT</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Background Image -->
    <section id="home" class="hero">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8 hero-content">
                    <h1>Discover Your<br><span style="color: #f1c40f;">Timeless Career</span></h1>
                    <p>"Find work that honors your talents and shapes your legacy"</p>
                </div>
            </div>
        </div>
    </section>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Navbar background change on scroll
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(44, 62, 80, 0.98)';
                navbar.style.padding = '0.8rem 0';
            } else {
                navbar.style.background = 'rgba(44, 62, 80, 0.95)';
                navbar.style.padding = '1.2rem 0';
            }
        });
    </script>
</body>
</html>
