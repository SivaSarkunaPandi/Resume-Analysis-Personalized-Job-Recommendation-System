<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Times New Roman with elegant fallbacks */
        body {
            font-family: 'Times New Roman', Times, serif;
            background: #faf7f2;
            color: #2c3e50;
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom animations */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation */
        .navbar {
            background: rgba(44, 62, 80, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            width: 100%;
            font-family: 'Times New Roman', Times, serif;
            font-size: 20px;
        }

        .navbar-brand {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 24px;
            color: white!important;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .navbar-brand:hover {
            transform: scale(1.05);
            color: #f39c12 !important;
        }

        .nav-link {
            font-family: 'Times New Roman', Times, serif;
            color: rgba(255,255,255,0.9) !important;
            font-weight: bold;
            margin: 0 1rem;
            position: relative;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #f1c40f;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .nav-link:hover {
            color: #f1c40f !important;
            transform: translateY(-2px);
        }

        /* Hero mini section */
        .hero-mini {
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            padding: 60px 0 40px;
            text-align: center;
            color: white;
            width: 100%;
        }

        .hero-mini h1 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 800;
            font-size: 2.8rem;
            animation: fadeInUp 1s ease;
        }

        .hero-mini p {
            font-size: 1.2rem;
            font-style: italic;
            opacity: 0.9;
        }

        /* Result container */
        .result-container {
            max-width: 800px;
            margin: -40px auto 60px;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        /* Main Job Card (golden gradient accent) */
        .main-job-card {
            background: white;
            border-radius: 30px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 3rem;
            border-bottom: 6px solid #f1c40f;
            transition: all 0.4s ease;
            animation: scaleIn 0.8s ease;
        }

        .main-job-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 50px rgba(0,0,0,0.15);
        }

        .main-job-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f39c12;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .main-job-title {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 800;
            font-size: 2.8rem;
            color: #2c3e50;
            margin: 0.5rem 0;
        }

        .confidence-badge {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border-radius: 50px;
            font-weight: 700;
            color: #2c3e50;
            margin-top: 1rem;
            font-size: 1rem;
        }

        /* Top 3 Cards */
        .section-title {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            border-radius: 2px;
        }

        .top-jobs-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .job-card {
            background: white;
            border-radius: 20px;
            padding: 1.8rem;
            flex: 1;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.4s ease;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .job-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 35px rgba(0,0,0,0.1);
            border-color: #f1c40f;
        }

        .job-card h3 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .job-score {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f39c12;
            background: #fef5e7;
            display: inline-block;
            padding: 0.3rem 1rem;
            border-radius: 50px;
            margin-top: 0.8rem;
        }

        /* Double Button Container */
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        /* Unified button style - both buttons use same golden gradient */
        .btn-home, .btn-upload {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #2c3e50;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            padding: 14px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.4s ease;
            border: none;
            box-shadow: 0 10px 20px rgba(241,196,15,0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-home::before, .btn-upload::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-home:hover::before, .btn-upload:hover::before {
            left: 100%;
        }

        .btn-home:hover, .btn-upload:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(241,196,15,0.4);
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            color: #2c3e50;
        }

        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            padding: 4rem 0 2rem;
            width: 100%;
            margin-top: auto;
        }

        .footer-logo {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: #f1c40f;
            margin-bottom: 1.5rem;
        }

        .footer-links h5 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #f1c40f;
            margin-bottom: 1.5rem;
        }

        .footer-links ul {
            list-style: none;
            padding: 0;
        }

        .footer-links li {
            margin-bottom: 0.8rem;
        }

        .footer-links a {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .footer-links a:hover {
            color: #f1c40f;
            padding-left: 8px;
        }

        .social-icons a {
            display: inline-block;
            width: 45px;
            height: 45px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            text-align: center;
            line-height: 45px;
            margin-right: 10px;
            color: white;
            transition: all 0.4s ease;
        }

        .social-icons a:hover {
            background: #f1c40f;
            color: #2c3e50;
            transform: translateY(-5px) rotate(360deg);
        }

        .copyright {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6);
            font-style: italic;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        @media (max-width: 768px) {
            .main-job-title {
                font-size: 2rem;
            }
            .job-card h3 {
                font-size: 1.3rem;
            }
            .hero-mini h1 {
                font-size: 2rem;
            }
            .btn-home, .btn-upload {
                padding: 12px 25px;
                font-size: 1rem;
            }
            .button-group {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    

    <!-- Mini Hero -->
    <div class="hero-mini">
        <div class="container">
            <h1>Your <span style="color: #f1c40f;">Career Compass</span></h1>
            <p>Insights driven by your unique talents and aspirations</p>
        </div>
    </div>

    <!-- Result Section -->
    <div class="result-container">
        <!-- Primary Recommendation Card -->
        <div class="main-job-card">
            <div class="main-job-label"><i class="fas fa-star"></i> Prime Recommendation</div>
            <div class="main-job-title">{{ job }}</div>
            <div class="confidence-badge">
                <i class="fas fa-chart-simple me-1"></i> Top Match
            </div>
        </div>

        <!-- Top 3 Career Recommendations -->
        <div class="section-title">Honorable Mentions</div>
        <div class="top-jobs-grid">
            {% for j, score in top3 %}
            <div class="job-card">
                <h3>{{ j }}</h3>
                <div class="job-score">{{ (score * 100) | round(1) }}% match</div>
            </div>
            {% endfor %}
        </div>

        <!-- Button Group: Both buttons now share identical golden gradient -->
        <div class="button-group">
            <a href="/predict" class="btn-upload">
                <i class="fas fa-upload"></i> Upload Another Resume
            </a>
            <a href="/" class="btn-home">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(44, 62, 80, 0.98)';
                navbar.style.padding = '0.8rem 0';
            } else {
                navbar.style.background = 'rgba(44, 62, 80, 0.95)';
                navbar.style.padding = '1.2rem 0';
            }
        });
    </script>
</body>
</html>
